openapi: 3.0.0
info:
  title: Lettus Rental Portal API
  description: API for rental properties, subscriptions, and tenancy scoring.
  version: 1.0.0

servers:
  - url: /lettus

paths:
  /properties:
    get:
      summary: List properties
      description: Returns published properties sorted by publication date (desc).
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status (available, rented, maintenance).
        - name: city
          in: query
          schema:
            type: string
        - name: propertyType
          in: query
          schema:
            type: string
        - name: minRent
          in: query
          schema:
            type: number
        - name: maxRent
          in: query
          schema:
            type: number
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search on title, description, address, city.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Property list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Created property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /properties/{id}:
    get:
      summary: Get property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Property record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Property not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Property not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions:
    post:
      summary: Create subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions/tenant/{tenantId}:
    get:
      summary: List subscriptions by tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionWithProperty'

  /subscriptions/property/{propertyId}:
    get:
      summary: List subscriptions by property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'

  /subscriptions/{id}/cancel:
    patch:
      summary: Cancel subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions/{id}/score:
    patch:
      summary: Set tenancy score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionScore'
      responses:
        '200':
          description: Updated subscription score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Property:
      type: object
      properties:
        id:
          type: integer
        landlord_id:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        property_type:
          type: string
          nullable: true
        address_line1:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        bedrooms:
          type: integer
          nullable: true
        bathrooms:
          type: integer
          nullable: true
        monthly_rent:
          type: number
        deposit_amount:
          type: number
          nullable: true
        available_from:
          type: string
          format: date
          nullable: true
        status:
          type: string
        published_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - monthly_rent

    PropertyCreate:
      type: object
      properties:
        landlord_id:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        property_type:
          type: string
          nullable: true
        address_line1:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        bedrooms:
          type: integer
          nullable: true
        bathrooms:
          type: integer
          nullable: true
        monthly_rent:
          type: number
        deposit_amount:
          type: number
          nullable: true
        available_from:
          type: string
          format: date
          nullable: true
        status:
          type: string
        published_at:
          type: string
          format: date-time
      required:
        - title
        - monthly_rent

    PropertyUpdate:
      allOf:
        - $ref: '#/components/schemas/PropertyCreate'

    Subscription:
      type: object
      properties:
        id:
          type: integer
        property_id:
          type: integer
        tenant_id:
          type: integer
        status:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        score_value:
          type: number
          nullable: true
        score_band:
          type: string
          nullable: true
        scored_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionWithProperty:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            title:
              type: string
            city:
              type: string
            monthly_rent:
              type: number
            property_status:
              type: string

    SubscriptionCreate:
      type: object
      properties:
        property_id:
          type: integer
        tenant_id:
          type: integer
        start_date:
          type: string
          format: date
        score_value:
          type: number
          nullable: true
        score_band:
          type: string
          nullable: true
      required:
        - property_id
        - tenant_id

    SubscriptionScore:
      type: object
      properties:
        score_value:
          type: number
        score_band:
          type: string
      required:
        - score_value
        - score_band

    Error:
      type: object
      properties:
        error:
          type: string
