<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettus Lettings - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            color: #1f2933;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-top: 6px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .links {
            margin-top: 16px;
            font-size: 14px;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create your Lettus account</h1>
        <form id="registerForm" action="/customer-portal/register" method="POST">
            <label for="username">Email (used as login)</label>
            <input type="email" id="username" name="username" required>
            <label for="email">Confirm email</label>
            <input type="email" id="email" name="email" required>
            <label for="customername">Full name</label>
            <input type="text" id="customername" name="customername" required>
            <label for="company">Profile name</label>
            <input type="text" id="company" name="company" placeholder="e.g. Smith Household" required>
            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="UK">United Kingdom</option>
                <option value="IE">Ireland</option>
                <option value="US">United States</option>
                <option value="ZZ">Other</option>
            </select>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <label for="customer_type">Account type</label>
            <select id="customer_type" name="customer_type" required>
                <option value="tenant">Tenant</option>
                <option value="landlord">Landlord</option>
            </select>
            <button type="submit">Create account</button>
        </form>
        <div class="links">
            <p>Already have an account? <a href="/customer-portal/login">Sign in</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            if (username !== email) {
                alert('Email fields must match.');
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
